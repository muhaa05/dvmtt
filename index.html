<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Панель учителя / Мугалим панели</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #3498db;
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-color: #333;
            --border-radius: 8px;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
        }
        .container { max-width: 600px; margin: 0 auto; }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--primary-color);
            color: white;
            padding: 15px 20px;
            border-radius: var(--border-radius);
            margin-bottom: 20px;
        }
        .lang-switch button {
            background: var(--accent-color);
            border: none;
            color: white;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: var(--border-radius);
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; }
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .btn-submit {
            width: 100%;
            background: #27ae60;
            color: white;
            border: none;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
        }
        .btn-submit:hover { background: #219150; }
        .btn-submit:disabled { background: #95a5a6; cursor: wait; }
        .info-note { font-size: 13px; color: #666; margin-top: 5px; }
        .live-box {
            background: #e8f4f8;
            border-radius: 4px;
            padding: 10px 12px;
            font-size: 14px;
            margin-bottom: 15px;
            line-height: 1.5;
        }
        .empty-box {
            background: #fdecea;
            color: #a93226;
            border-radius: 4px;
            padding: 10px 12px;
            font-size: 14px;
            margin-bottom: 15px;
            display: none;
        }
        .date-line { font-size: 13px; color: #666; margin-bottom: 15px; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h2 id="app-title">Ввод посещаемости</h2>
        <div class="lang-switch">
            <button onclick="switchLang('ru')">РУС</button>
            <button onclick="switchLang('kg')">КЫР</button>
        </div>
    </header>

    <div class="card">
        <div class="date-line" id="date-line"></div>

        <form id="teacher-form">
            <div class="form-group">
                <label id="lbl-shift">Смена</label>
                <select id="shift-select">
                    <option value="1">1-смена</option>
                    <option value="2">2-смена</option>
                </select>
            </div>

            <div class="form-group">
                <label id="lbl-class">Класс</label>
                <select id="class-select" required></select>
            </div>

            <div class="empty-box" id="empty-box"></div>

            <div class="live-box" id="live-box"></div>

            <div class="form-group">
                <label id="lbl-lesson-type">Выберите урок для отправки</label>
                <select id="lesson-type">
                    <option value="1">1-урок</option>
                    <option value="2">2-урок</option>
                    <option value="6">6-урок</option>
                </select>
            </div>

            <div class="form-group">
                <label id="lbl-lesson-count">Присутствовало на уроке</label>
                <input type="number" id="lesson-count" placeholder="30" required min="0">
                <div class="info-note" id="note-text">Введите количество пришедших учеников на выбранный урок.</div>
            </div>

            <button type="submit" class="btn-submit" id="btn-send">Отправить директору</button>
        </form>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, setDoc, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        projectId: "qr-code-hujamov"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const translations = {
        ru: {
            appTitle: "Ввод посещаемости",
            lblShift: "Смена",
            lblClass: "Класс",
            lblLessonType: "Выберите урок для отправки",
            lblLessonCount: "Присутствовало на уроке",
            noteText: "Введите количество пришедших учеников на выбранный урок.",
            btnSend: "Отправить директору",
            successMsg: "Данные успешно отправлены директору!",
            dateLabel: "Дата",
            liveLabel: "Сейчас в базе",
            total: "Всего в классе",
            lesson: "урок",
            noClasses: "Директор ещё не добавил классы для этой смены.",
            chooseClass: "— выберите класс —",
            tooMany: "Число присутствующих больше, чем учеников в классе"
        },
        kg: {
            appTitle: "Катышууну киргизүү",
            lblShift: "Нөөмөт (Смена)",
            lblClass: "Класс",
            lblLessonType: "Жөнөтүлө турган сабакты тандаңыз",
            lblLessonCount: "Сабакта катышкандардын саны",
            noteText: "Тандалган сабакта келген окуучулардын санын киргизиңиз.",
            btnSend: "Директорго жөнөтүү",
            successMsg: "Маалымат директорго ийгиликтүү жөнөтүлдү!",
            dateLabel: "Күнү",
            liveLabel: "Базада азыр",
            total: "Класста жалпы",
            lesson: "сабак",
            noClasses: "Директор бул нөөмөт үчүн класстарды кошо элек.",
            chooseClass: "— класс тандаңыз —",
            tooMany: "Катышкандардын саны класстагы окуучулардан көп"
        }
    };

    let currentLang = 'ru';
    let classesData = [];   // директор қўшган класслар
    let attData = {};       // бугунги давомат: className -> data

    function todayStr() {
        const d = new Date();
        const m = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        return `${d.getFullYear()}-${m}-${day}`;
    }

    const el = (id) => document.getElementById(id);

    // ---------- Классларни базадан олиш (real-time) ----------
    onSnapshot(collection(db, "classes"), (snap) => {
        classesData = [];
        snap.forEach(d => classesData.push(d.data()));
        fillClassSelect();
    });

    // ---------- Бугунги давомат (real-time) ----------
    onSnapshot(collection(db, "attendance"), (snap) => {
        attData = {};
        const today = todayStr();
        snap.forEach(d => {
            const x = d.data();
            if (x.date === today) attData[x.shift + '_' + x.className] = x;
        });
        renderLive();
    });

    function fillClassSelect() {
        const shift = el('shift-select').value;
        const select = el('class-select');
        const prev = select.value;
        const t = translations[currentLang];

        const list = classesData
            .filter(c => c.shift === shift)
            .sort((a, b) => String(a.className).localeCompare(String(b.className), undefined, { numeric: true }));

        select.innerHTML = `<option value="">${t.chooseClass}</option>` +
            list.map(c => `<option value="${c.className}">${c.className} (${c.total})</option>`).join('');

        if (list.some(c => c.className === prev)) select.value = prev;

        const empty = el('empty-box');
        empty.innerText = t.noClasses;
        empty.style.display = list.length === 0 ? 'block' : 'none';
        renderLive();
    }

    function renderLive() {
        const box = el('live-box');
        const shift = el('shift-select').value;
        const className = el('class-select').value;
        const t = translations[currentLang];

        if (!className) { box.style.display = 'none'; return; }

        const cls = classesData.find(c => c.shift === shift && c.className === className);
        const att = attData[shift + '_' + className] || {};
        box.style.display = 'block';
        box.innerHTML =
            `<strong>${t.total}: ${cls ? cls.total : '—'}</strong><br>` +
            `${t.liveLabel}: 1-${t.lesson}: ${att.l1 ?? '—'} | ` +
            `2-${t.lesson}: ${att.l2 ?? '—'} | ` +
            `6-${t.lesson}: ${att.l6 ?? '—'}`;
    }

    el('shift-select').addEventListener('change', fillClassSelect);
    el('class-select').addEventListener('change', renderLive);

    window.switchLang = function(lang) {
        currentLang = lang;
        const t = translations[lang];
        el('app-title').innerText = t.appTitle;
        el('lbl-shift').innerText = t.lblShift;
        el('lbl-class').innerText = t.lblClass;
        el('lbl-lesson-type').innerText = t.lblLessonType;
        el('lbl-lesson-count').innerText = t.lblLessonCount;
        el('note-text').innerText = t.noteText;
        el('btn-send').innerText = t.btnSend;
        el('date-line').innerText = `${t.dateLabel}: ${todayStr()}`;
        fillClassSelect();
    };

    // ---------- Юбориш ----------
    el('teacher-form').addEventListener('submit', async function(e) {
        e.preventDefault();

        const btn = el('btn-send');
        const shift = el('shift-select').value;
        const className = el('class-select').value;
        const lessonType = el('lesson-type').value;
        const count = parseInt(el('lesson-count').value);
        const date = todayStr();

        if (!className) return;

        const cls = classesData.find(c => c.shift === shift && c.className === className);
        if (cls && count > cls.total) {
            alert(`${translations[currentLang].tooMany} (${cls.total})`);
            return;
        }

        const docRef = doc(db, "attendance", `${date}_${shift}_${className}`);
        const dataToSave = {
            date: date,
            shift: shift,
            className: className,
            updatedAt: Date.now()
        };
        dataToSave['l' + lessonType] = count;

        btn.disabled = true;
        try {
            await setDoc(docRef, dataToSave, { merge: true });
            alert(translations[currentLang].successMsg);
            el('lesson-count').value = '';
        } catch (error) {
            console.error("Xatolik: ", error);
            alert("Xatolik yuz berdi: " + error.message);
        } finally {
            btn.disabled = false;
        }
    });

    switchLang('ru');
</script>

</body>
</html>
